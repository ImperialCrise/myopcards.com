services:
  # NordVPN (OpenVPN) — HTTP proxy on host :8888 for PHP scraping (SCRAPING_HTTP_PROXY).
  # Requires NORDVPN_USER / NORDVPN_PASSWORD in .env (Nord account, not API key).
  # Start: docker compose --profile nordvpn up -d gluetun
  # The .ovpn file is mounted read-only; credentials are injected by Gluetun (auth-user-pass).
  gluetun:
    image: qdm12/gluetun:latest
    container_name: myopcards-gluetun
    profiles:
      - nordvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: openvpn
      OPENVPN_CUSTOM_CONFIG: /gluetun/nord.ovpn
      OPENVPN_USER: ${NORDVPN_USER}
      OPENVPN_PASSWORD: ${NORDVPN_PASSWORD}
      UPDATER_PERIOD: 24h
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      HEALTH_SERVER_ADDRESS: 127.0.0.1:9999
    volumes:
      - ./config/fr912.nordvpn.com.udp.ovpn:/gluetun/nord.ovpn:ro
    ports:
      - "127.0.0.1:8888:8888/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- https://ipinfo.io/ip | grep -qE '^[0-9.]+$'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  game-server:
    build: ./game-server
    container_name: myopcards-game-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    environment:
      DB_HOST: host.docker.internal
      BIND_ADDRESS: "0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Cardmarket requests originate here → use host VPN (NordVPN OpenVPN/WireGuard) or place this service
  # behind a VPN container network so egress IP is not your datacenter.
  myopcards-flaresolverr:
    image: 21hsmw/flaresolverr:nodriver
    container_name: myopcards-flaresolverr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8192:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - TZ=UTC
    deploy:
      resources:
        limits:
          memory: 1g

  minio:
    image: minio/minio:latest
    container_name: myopcards-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
